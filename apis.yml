aid: roomi
name: Roomi
description: >-
  Roomi is a consumer roommate- and room-rental matching platform that connects verified renters looking
  for roommates with people posting available rooms, sublets, spare rooms, and monthly rentals across more
  than 200 cities. The service offers a searchable listing experience with filters for amenities, duration,
  and property type, roommate verification and ID/background checks, an in-app booking and messaging system,
  and a safety-check service. Roomi is delivered primarily through free iOS and Android mobile apps and a
  web experience built on Bubble.io, monetized through premium features such as background checks and listing
  boosts. It exposes no public developer API, developer portal, SDK, or documentation; this profile was added
  to the API Evangelist network as a portfolio-company lead of DCM Ventures.
